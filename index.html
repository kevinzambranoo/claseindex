<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predicción</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 700px;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
      color: #444;
    }
    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem 2rem;
    }
    label {
      font-weight: bold;
      margin-bottom: 0.3rem;
      display: block;
    }
    input {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    .full-width {
      grid-column: span 2;
      text-align: center;
    }
    button {
      background: #4CAF50;
      color: #fff;
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background: #45a049;
    }
    #resultado {
      margin-top: 1rem;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      color: #222;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Formulario de Predicción</h1>
    <form id="predictForm">
      <div>
        <label for="N">N (int)</label>
        <input type="number" id="N" name="N" required>
      </div>
      <div>
        <label for="P">P (int)</label>
        <input type="number" id="P" name="P" required>
      </div>
      <div>
        <label for="K">K (int)</label>
        <input type="number" id="K" name="K" required>
      </div>
      <div>
        <label for="temperature">Temperature (float)</label>
        <input type="number" step="any" id="temperature" name="temperature" required>
      </div>
      <div>
        <label for="humidity">Humidity (float)</label>
        <input type="number" step="any" id="humidity" name="humidity" required>
      </div>
      <div>
        <label for="ph">pH (float)</label>
        <input type="number" step="any" id="ph" name="ph" required>
      </div>
      <div class="full-width">
        <label for="rainfall">Rainfall (float)</label>
        <input type="number" step="any" id="rainfall" name="rainfall" required>
      </div>
      <div class="full-width">
        <button type="submit">Prediccion</button>
      </div>
    </form>
    <div id="resultado"></div>
  </div>

  <script>
    document.getElementById('predictForm').addEventListener('submit', async function (event) {
      event.preventDefault();

      // Tomar valores del formulario
      const data = {
        N: parseInt(document.getElementById('N').value),
        P: parseInt(document.getElementById('P').value),
        K: parseInt(document.getElementById('K').value),
        temperature: parseFloat(document.getElementById('temperature').value),
        humidity: parseFloat(document.getElementById('humidity').value),
        ph: parseFloat(document.getElementById('ph').value),
        rainfall: parseFloat(document.getElementById('rainfall').value)
      };

      try {
        const response = await fetch('https://clase2-b7me.onrender.com/predict', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        if (!response.ok) {
          throw new Error('Error en la petición: ' + response.statusText);
        }

        const result = await response.json();
        document.getElementById('resultado').textContent = 'Predicción: ' + result.prediction;
      } catch (error) {
        document.getElementById('resultado').textContent = 'Error: ' + error.message;
      }
    });
  </script>
</body>
</html>
